services:
  - type: web
    name: royal-spice-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@royalspice.com
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: DEFAULT_TAX_PERCENTAGE
        value: 5
